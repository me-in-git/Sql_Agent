name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  eval:
    # Runs the 30-question execution-accuracy eval against a real model when a
    # GROQ_API_KEY repository secret is configured.
    needs: test
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.GROQ_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.GROQ_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
      - if: env.GROQ_API_KEY != ''
        run: pip install -r requirements.txt
      - if: env.GROQ_API_KEY != ''
        run: python -m eval.run_eval --out eval-results.json
      - if: env.GROQ_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
